<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簡單記帳 icon 產生器</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #FFF2DF; color: #7E8072; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; font-size: 15px; color: #827968; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .item { background: #F2E1CD; border-radius: 14px; padding: 14px; text-align: center; }
  .item canvas { display: block; margin: 0 auto 10px; border-radius: 18px; background: #fff; width: 128px; height: 128px; }
  .item small { display: block; margin-bottom: 8px; color: #827968; }
  button { border: 0; border-radius: 14px; background: #7E8072; color: #FFEDD4; font-size: 16px; padding: 10px 18px; cursor: pointer; }
  button.big { margin: 20px 0; font-size: 18px; padding: 12px 24px; }
  .preview48 { width: 48px; height: 48px; border-radius: 10px; margin-left: 12px; vertical-align: middle; }
</style>
</head>
<body>
<h1>簡單記帳 icon 產生器</h1>
<p>讀取 <code>icons/icon.svg</code>，按一下即可下載 PNG；下載後放進 <code>icons/</code> 資料夾。右側為 48px 小尺寸預覽。 <canvas id="p48" class="preview48" width="48" height="48"></canvas></p>
<button class="big" id="all">一鍵下載全部（180 / 192 / 512 / maskable 512）</button>
<div class="row" id="row"></div>

<script>
(function () {
  const SIZES = [
    { name: 'icon-180.png', size: 180, label: 'apple-touch-icon 180' },
    { name: 'icon-192.png', size: 192, label: 'Android 192' },
    { name: 'icon-512.png', size: 512, label: 'Android 512' },
    { name: 'icon-maskable-512.png', size: 512, label: 'maskable 512' }
  ];
  const row = document.getElementById('row');
  const items = [];
  const img = new Image();

  function draw(canvas, size) {
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#7E8072';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
  }

  function downloadCanvas(canvas, name) {
    return new Promise(resolve => {
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); resolve(); }, 400);
      }, 'image/png');
    });
  }

  img.onload = () => {
    SIZES.forEach(s => {
      const item = document.createElement('div');
      item.className = 'item';
      const canvas = document.createElement('canvas');
      draw(canvas, s.size);
      const small = document.createElement('small');
      small.textContent = s.label + '（' + s.name + '）';
      const btn = document.createElement('button');
      btn.textContent = '下載';
      btn.onclick = () => downloadCanvas(canvas, s.name);
      item.append(canvas, small, btn);
      row.appendChild(item);
      items.push({ canvas, name: s.name });
    });
    draw(document.getElementById('p48'), 48);
  };
  img.onerror = () => { row.textContent = '讀不到 icons/icon.svg，請確認檔案位置（需用 http 伺服器或 GitHub Pages 開啟）。'; };
  img.src = './icons/icon.svg';

  document.getElementById('all').onclick = async () => {
    for (const it of items) { await downloadCanvas(it.canvas, it.name); await new Promise(r => setTimeout(r, 300)); }
  };
})();
</script>
</body>
</html>
